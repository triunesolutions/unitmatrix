<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unit plan matching table</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #000; background: #fff; font: 12px/1.2 Arial, sans-serif; }
  .table-wrap { max-height: 520px; overflow: auto; border: 1px solid #000; border-bottom: 0; background: #fff; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .total-table { border: 1px solid #000; }
  col.floor { width: 34.375%; }
  col.plan { width: 21.875%; }
  col.qty { width: 21.875%; }
  col.merge { width: 21.875%; }
  th, td { border: 1px solid #000; padding: 3px 6px; height: 22px; }
  th { position: sticky; top: 0; z-index: 2; background: #fff; font-weight: 700; text-align: left; }
  td.qty, td.merge, td.total { text-align: right; font-variant-numeric: tabular-nums; }
  td.group-plan, td.group-merge { vertical-align: middle; }
  td.manual { color: #c62828; font-weight: 700; }
  .edit-group { position: relative; }
  .edit-group summary { cursor: pointer; list-style: none; }
  .edit-group summary::-webkit-details-marker { display: none; }
  .edit-group summary::after { content: "Edit"; float: right; margin-left: 6px; color: #333; text-decoration: underline; }
  .edit-popover {
    position: absolute; top: 19px; left: -2px; z-index: 5; width: 250px; max-height: 260px;
    overflow: auto; padding: 6px; border: 1px solid #000; background: #fff;
    box-shadow: 0 2px 6px #0003;
  }
  .edit-row { display: grid; grid-template-columns: minmax(70px, 1fr) minmax(110px, 1.2fr); gap: 6px; align-items: center; padding: 3px 0; }
  .edit-row select { width: 100%; min-width: 0; }
  select { padding: 2px; border: 1px solid #777; color: #000; background: #fff; font: inherit; }
  tr.grand-total td { font-weight: 700; border-top: 2px solid #000; border-bottom: 2px solid #000; }
</style>
</head>
<body>
<div class="table-wrap">
  <table aria-label="Unit plan matching">
    <colgroup><col class="floor"><col class="plan"><col class="qty"><col class="merge"></colgroup>
    <thead><tr><th>Floor Tag</th><th>Unit Plan</th><th>Qty</th><th>Merge Qty</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<table class="total-table" aria-label="Matching totals">
  <colgroup><col class="floor"><col class="plan"><col class="qty"><col class="merge"></colgroup>
  <tbody id="grand-total"></tbody>
</table>
<script>
"use strict";

function post(message) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true}, message), "*");
}
function setHeight(height) {
  post({type: "streamlit:setFrameHeight", height: height});
}
function setValue(value) {
  post({type: "streamlit:setComponentValue", dataType: "json", value: value});
}

const UNASSIGNED = "__UNIT_MATRIX_UNASSIGNED__";
let RECORDS = [];
let PLANS = [];
let UNASSIGNED_LABEL = "(not placed)";
let GRAND_TOTAL = {qty: 0, merged: 0};
let SIGNATURE = null;

function normalise(value) { return String(value || "").trim().toUpperCase(); }
const NATURAL = new Intl.Collator(undefined, {numeric: true, sensitivity: "base"});

function loadRows(rows) {
  const records = [];
  let currentUnit = UNASSIGNED;
  for (const row of rows || []) {
    if (row.unit) {
      currentUnit = row.unit === UNASSIGNED_LABEL ? UNASSIGNED : row.unit;
    }
    if (row.tag) {
      records.push({
        tag: row.tag,
        unit: currentUnit,
        qty: row.qty,
        manual: Boolean(row.manual),
      });
    } else if (row.unit) {
      // Keep an otherwise unused plan visible, as the Excel Merged sheet does.
      records.push({tag: "", unit: currentUnit, qty: "", manual: false});
    }
  }
  return records;
}

function groupedRows() {
  const groups = new Map();
  for (const plan of PLANS) groups.set(plan, {unit: plan, tags: []});
  for (const record of RECORDS) {
    if (!record.tag) continue;
    const key = record.unit || UNASSIGNED;
    if (!groups.has(key)) groups.set(key, {unit: key, tags: []});
    groups.get(key).tags.push(record);
  }
  const list = [...groups.values()];
  for (const group of list) {
    group.tags.sort((a, b) => NATURAL.compare(a.tag, b.tag));
    group.sortKey = group.tags.length ? normalise(group.tags[0].tag) : "\uffff" + normalise(group.unit);
    group.mergeQty = group.tags.reduce((sum, record) => sum + (Number(record.qty) || 0), 0);
  }
  return list.sort((a, b) => NATURAL.compare(a.sortKey, b.sortKey) ||
    NATURAL.compare(a.unit, b.unit));
}

function publish() {
  const assigned = Object.fromEntries(PLANS.map((plan) => [plan, []]));
  const manual = [];
  const unassigned = [];
  for (const record of RECORDS) {
    if (!record.tag) continue;
    if (record.unit === UNASSIGNED) {
      unassigned.push(record.tag);
    } else {
      assigned[record.unit] = assigned[record.unit] || [];
      assigned[record.unit].push(record.tag);
      if (record.manual) manual.push(record.tag);
    }
  }
  setValue({assigned: assigned, manual: manual, unassigned: unassigned});
}

function editor(group) {
  const details = document.createElement("details");
  details.className = "edit-group";
  const summary = document.createElement("summary");
  summary.textContent = group.unit === UNASSIGNED ? UNASSIGNED_LABEL : group.unit;
  details.appendChild(summary);

  const panel = document.createElement("div");
  panel.className = "edit-popover";
  for (const record of group.tags) {
    const line = document.createElement("label");
    line.className = "edit-row";
    const name = document.createElement("span");
    name.textContent = record.tag;
    if (record.manual) name.className = "manual";
    const select = document.createElement("select");
    select.setAttribute("aria-label", `Unit Plan for ${record.tag}`);
    const none = document.createElement("option");
    none.value = UNASSIGNED;
    none.textContent = UNASSIGNED_LABEL;
    select.appendChild(none);
    for (const plan of PLANS) {
      const option = document.createElement("option");
      option.value = plan;
      option.textContent = plan;
      select.appendChild(option);
    }
    select.value = record.unit || UNASSIGNED;
    select.addEventListener("change", () => {
      if (select.value === record.unit) return;
      record.unit = select.value;
      // Like a drag assignment, moving a tag to a plan is manual; returning it to the
      // unassigned pool clears the manual flag.
      record.manual = select.value !== UNASSIGNED;
      render();
      publish();
    });
    line.append(name, select);
    panel.appendChild(line);
  }
  details.appendChild(panel);
  return details;
}

function render() {
  const body = document.getElementById("rows");
  body.textContent = "";
  const groups = groupedRows();
  GRAND_TOTAL = {
    qty: RECORDS.reduce((sum, record) => sum + (Number(record.qty) || 0), 0),
    merged: groups.reduce((sum, group) => sum + (Number(group.mergeQty) || 0), 0),
  };
  for (const group of groups) {
    if (!group.tags.length) {
      const tr = document.createElement("tr");
      const floor = document.createElement("td");
      const plan = document.createElement("td");
      plan.className = "group-plan";
      plan.textContent = group.unit;
      const qty = document.createElement("td");
      qty.className = "qty";
      const merged = document.createElement("td");
      merged.className = "group-merge merge";
      merged.textContent = "0";
      tr.append(floor, plan, qty, merged);
      body.appendChild(tr);
      continue;
    }

    group.tags.forEach((record, index) => {
      const tr = document.createElement("tr");
      const floor = document.createElement("td");
      floor.textContent = record.tag;
      if (record.manual) floor.className = "manual";
      tr.appendChild(floor);

      if (index === 0) {
        const plan = document.createElement("td");
        plan.className = "group-plan";
        plan.rowSpan = group.tags.length;
        plan.appendChild(editor(group));
        tr.appendChild(plan);
      }

      const qty = document.createElement("td");
      qty.className = "qty";
      qty.textContent = record.qty;
      tr.appendChild(qty);

      if (index === 0) {
        const merged = document.createElement("td");
        merged.className = "group-merge merge";
        merged.rowSpan = group.tags.length;
        merged.textContent = group.mergeQty;
        tr.appendChild(merged);
      }
      body.appendChild(tr);
    });
  }

  const totalBody = document.getElementById("grand-total");
  totalBody.textContent = "";
  const total = document.createElement("tr");
  total.className = "grand-total";
  const totalLabel = document.createElement("td");
  totalLabel.textContent = "Grand Total";
  const totalUnit = document.createElement("td");
  const totalQty = document.createElement("td");
  totalQty.className = "total";
  totalQty.textContent = GRAND_TOTAL.qty;
  const totalMerged = document.createElement("td");
  totalMerged.className = "total";
  totalMerged.textContent = GRAND_TOTAL.merged;
  total.append(totalLabel, totalUnit, totalQty, totalMerged);
  totalBody.appendChild(total);
  setHeight(Math.min(Math.max(document.body.scrollHeight + 8, 120), 580));
}

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  const signature = JSON.stringify([args.rows, args.plans, args.unassigned_label, args.grand_total]);
  if (signature === SIGNATURE) return;
  SIGNATURE = signature;
  PLANS = args.plans || [];
  UNASSIGNED_LABEL = args.unassigned_label || UNASSIGNED_LABEL;
  GRAND_TOTAL = args.grand_total || GRAND_TOTAL;
  RECORDS = loadRows(args.rows);
  render();
});

post({type: "streamlit:componentReady", apiVersion: 1});
setHeight(160);
</script>
</body>
</html>
